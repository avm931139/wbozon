<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>P&amp;L маркетплейсов</title>
  <style>
    :root{--bg:#0b1020;--panel:#151c30;--line:#29334d;--text:#eef3ff;--muted:#94a3bd;--accent:#6ea8fe;--good:#38d39f;--bad:#ff6b7a;--warn:#f4d88c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui;line-height:1.4}
    header{padding:20px 4vw;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:end;justify-content:space-between}
    h1{margin:0;font-size:26px}.muted{color:var(--muted)}nav{display:flex;gap:8px;margin-top:12px}
    nav a{color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px}nav a.active{background:var(--accent);color:#061020;font-weight:700}
    main{padding:22px 4vw}.filters{display:flex;gap:10px;flex-wrap:wrap}input,button{background:#11182a;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}button{background:var(--accent);color:#061020;font-weight:700;cursor:pointer}
    h2{font-size:19px;margin:28px 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}.card.total{border-color:#4169b1}.total-layout{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(440px,1.2fr);gap:28px;align-items:start}.total-summary,.total-breakdown{min-width:0}.total-breakdown .expense-title{margin-top:0}.card h3{margin:0 0 12px;color:var(--muted);font-size:13px;text-transform:uppercase}.big{font-size:29px;font-weight:780;margin-bottom:14px}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:8px 0;border-top:1px solid rgba(148,163,189,.13);color:var(--muted)}.row b{color:var(--text);text-align:right}.delta{display:block;font-size:12px;color:var(--muted);font-weight:500}.cost-warning{color:var(--warn);font-size:12px}.notice{padding:12px;border:1px solid #705d32;background:#2b2618;border-radius:9px;color:var(--warn)}
    .info{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:5px;border:1px solid #65718d;border-radius:50%;font-size:12px;color:#c9d5ee;cursor:help;position:relative;vertical-align:middle}.info:hover::after,.info:focus::after{content:attr(data-tip);position:absolute;z-index:20;left:0;top:24px;width:min(390px,80vw);padding:11px;border:1px solid #53617d;border-radius:9px;background:#080d19;color:var(--text);font-weight:400;font-size:13px;line-height:1.45;text-transform:none;white-space:normal;box-shadow:0 10px 30px #0008}
    .expense-title{margin:18px 0 6px;font-size:14px}.expenses{width:100%;border-collapse:collapse}.expenses th,.expenses td{padding:8px 5px;border-top:1px solid rgba(148,163,189,.13);text-align:right;vertical-align:top}.expenses th:first-child,.expenses td:first-child{text-align:left}.expenses th{font-size:11px;color:var(--muted);font-weight:600}.expense-source{display:block;color:var(--muted);font-size:11px}.unallocated{margin:-5px 0 12px;padding:8px 10px;border:1px solid #594f35;border-radius:8px;background:#272318;color:#d7cda9;font-size:12px}.unallocated b{color:#f3dda0}.unallocated-parts{display:block;margin-top:3px;color:var(--muted);font-size:11px}.source{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.error{color:var(--bad)}
    @media(max-width:1000px){.total-layout{grid-template-columns:1fr}.total-breakdown .expense-title{margin-top:18px}}@media(max-width:650px){header{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.row{display:block}.row b{display:block;text-align:left;margin-top:4px}.expenses{font-size:13px}}
  </style>
</head>
<body>
<header>
  <div><h1>P&amp;L / 损益表</h1><div class="muted">Точные финансовые отчёты кабинетов, полная расшифровка затрат и сравнение с равным прошлым периодом</div><nav><a href="/">Оперативный</a><a class="active" href="/pnl">P&amp;L</a><a href="/stocks">Остатки</a><a href="/abc">ABC товаров</a></nav></div>
  <div class="filters"><input id="from" type="date"><input id="to" type="date"><input id="month" type="month" title="Выбрать месяц" onchange="selectMonth()"><button onclick="load()">Обновить</button><button onclick="exportExcel()">Выгрузить в Excel</button></div>
</header>
<main><div id="status"></div><h2>Все маркетплейсы / 全部平台</h2><div id="total"></div><h2>По площадкам / 各平台</h2><div class="grid" id="markets"></div></main>
<script>
const names={wb:'Wildberries',ozon:'Ozon',yandex_market:'Яндекс Маркет'};
const rub=n=>n===null||n===undefined?'—':new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Number(n||0))+' ₽';
const pct=n=>Number(n||0).toFixed(1)+'%';
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const info=t=>`<span class="info" tabindex="0" data-tip="${String(t||'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}">?</span>`;
function delta(now,old,suffix='%'){if(now===null||now===undefined||old===null||old===undefined)return '';now=Number(now);old=Number(old);if(!old)return now?'<span class="delta">новое значение</span>':'';let value=(now-old)/Math.abs(old)*100;return `<span class="delta">к прошлому периоду: ${value>=0?'+':''}${value.toFixed(1)}${suffix}</span>`}
function points(now,old){if(now===null||old===null||now===undefined||old===undefined)return '';let value=Number(now)-Number(old);return `<span class="delta">к прошлому периоду: ${value>=0?'+':''}${value.toFixed(1)} п.п.</span>`}
function metric(label,value,tip,comparison=''){return `<div class="row"><span>${label}${info(tip)}</span><b>${value}${comparison}</b></div>`}
function selectMonth(){if(!month.value)return;let [year,value]=month.value.split('-').map(Number);from.value=`${month.value}-01`;to.value=iso(new Date(year,value,0));load()}
function exportExcel(){let query=new URLSearchParams({report:'pnl',from:from.value,to:to.value});window.location.href='/api/export?'+query}
function defaultPnlPeriod(now){let last=new Date(now.getFullYear(),now.getMonth(),now.getDate()),daysAfterSunday=last.getDay()||7;last.setDate(last.getDate()-daysAfterSunday);return {first:new Date(last.getFullYear(),last.getMonth(),1),last}}
function previousLine(previous,key){return (previous.expense_lines||[]).find(x=>x.key===key)||{} }
function expenseTable(value,previous,total=false){let lines=value.expense_lines||[];if(!lines.length)return '<div class="notice">Детализация затрат отсутствует.</div>';return `<table class="expenses"><thead><tr><th>Статья ${info(total?'Сопоставимые статьи объединены по трём площадкам.':'Название операции сохранено из финансового источника площадки.')}</th><th>Сумма</th><th>% выручки</th></tr></thead><tbody>${lines.map(line=>{let old=previousLine(previous,line.key);return `<tr><td>${line.label}${line.source?`<span class="expense-source">${line.source}</span>`:''}</td><td>${rub(line.amount)}${delta(line.amount,old.amount)}</td><td>${pct(line.share_percent)}${points(line.share_percent,old.share_percent)}</td></tr>`}).join('')}</tbody></table>`}
function card(key,value,previous,totalRevenue,totalProfit){if(!value.available)return `<div class="card"><h3>${names[key]}</h3><div class="notice">Нет точного P&amp;L за весь период.<br>${value.notice||''}</div><div class="source">Источник: ${value.source}</div></div>`;let costWarn=value.cost_missing?'<span class="cost-warning">Есть проданные товары без себестоимости</span>':'';let revenueShare=totalRevenue?Number(value.revenue||0)/totalRevenue*100:0,profitShare=totalProfit?Number(value.profit||0)/totalProfit*100:0;let source=`${value.source_endpoint} → ${value.source_table}`,coverage=value.finance_from&&value.finance_through?` Покрытие строк: ${value.finance_from} — ${value.finance_through}.`:'';return `<div class="card"><h3>${names[key]} · точные финансы</h3><div class="big">${rub(value.profit)}${delta(value.profit,previous.profit)}</div>${metric('Продажи за вычетом возвратов / 销售净额',rub(value.sales_revenue),'Финансовая стоимость реализованных товаров с учётом возвратов и сторно. Источник: '+value.source,delta(value.sales_revenue,previous.sales_revenue))}${metric('Компенсации / 补偿',rub(value.compensation),'Положительные компенсации и прочие начисления, выделенные финансовым отчётом площадки.',delta(value.compensation,previous.compensation))}${metric('Выручка / 收入',rub(value.revenue),'Продажи после возвратов и сторно плюс компенсации. Используются только финансовые отчёты, не оперативные заказы.',delta(value.revenue,previous.revenue))}${metric('Все расходы МП / 平台全部费用',rub(value.expenses)+' · '+pct(value.expense_ratio),'Сумма всех удержаний и отрицательных финансовых операций. Детализация ниже обязана сходиться с этим итогом.',delta(value.expenses,previous.expenses)+points(value.expense_ratio,previous.expense_ratio))}${metric('К выплате до себестоимости / 扣除成本前净额',rub(value.net_payout),'Выручка минус все расходы маркетплейса.',delta(value.net_payout,previous.net_payout))}${metric('Себестоимость проданных товаров / 已售商品成本',rub(value.cost_of_goods)+' '+costWarn,'Количество реализованных товаров из финансовых строк умножается на действующую себестоимость связанного товара. Если связи или цены нет, показывается предупреждение.',delta(value.cost_of_goods,previous.cost_of_goods))}${metric('Прибыль / 利润',rub(value.profit)+' · '+pct(value.profit_margin),'Выручка минус расходы маркетплейса и себестоимость. Налоги, зарплаты и общехозяйственные расходы пока не входят.',delta(value.profit,previous.profit)+points(value.profit_margin,previous.profit_margin))}${metric('Доля общего результата',pct(revenueShare)+' выручки / '+pct(profitShare)+' прибыли','Вклад этой площадки в подтверждённые показатели всех доступных площадок выбранного периода.')}<div class="expense-title"><b>Расшифровка расходов</b>${info('Каждая строка получена из финансовых данных площадки. Процент = статья расходов ÷ выручка × 100%.')}</div>${expenseTable(value,previous)}<div class="source">Источник: ${source}.${coverage} Обновлено в БД: ${value.updated_at||'время не определено'}.</div></div>`}
function totalCard(value,previous){let warning=value.covered<3?`Показатели суммируют только площадки с точным покрытием: ${value.covered}/3.`:'Все три площадки имеют точные данные за период.';return `<div class="card total"><h3>Консолидированный P&amp;L · ${value.covered}/3</h3><div class="total-layout"><div class="total-summary"><div class="big">${rub(value.profit)}${delta(value.profit,previous.profit)}</div><div class="notice">${warning}</div>${metric('Продажи за вычетом возвратов',rub(value.sales_revenue),'Сумма финансовых продаж доступных площадок после их возвратов и сторно.',delta(value.sales_revenue,previous.sales_revenue))}${metric('Компенсации',rub(value.compensation),'Сумма компенсаций доступных площадок.',delta(value.compensation,previous.compensation))}${metric('Выручка',rub(value.revenue),'Консолидированная финансовая выручка доступных площадок.',delta(value.revenue,previous.revenue))}${metric('Расходы маркетплейсов',rub(value.expenses)+' · '+pct(value.expense_ratio),'Все комиссии, логистика, хранение, реклама, услуги, штрафы и корректировки доступных площадок.',delta(value.expenses,previous.expenses)+points(value.expense_ratio,previous.expense_ratio))}${metric('К выплате до себестоимости',rub(value.net_payout),'Выручка минус расходы маркетплейсов.',delta(value.net_payout,previous.net_payout))}${metric('Себестоимость',rub(value.cost_of_goods)+(value.cost_missing?' · есть товары без себестоимости':''),'Сумма себестоимости реализованных товаров по доступным площадкам.',delta(value.cost_of_goods,previous.cost_of_goods))}${metric('Прибыль',rub(value.profit)+' · '+pct(value.profit_margin),'Выручка минус расходы маркетплейсов и себестоимость.',delta(value.profit,previous.profit)+points(value.profit_margin,previous.profit_margin))}</div><div class="total-breakdown"><div class="expense-title"><b>Расходы по категориям</b>${info('Исходные статьи каждой площадки приведены к общим категориям только в сводном блоке. В карточках ниже сохранены исходные названия.')}</div>${expenseTable(value,previous,true)}</div></div></div>`}
async function load(){let query=new URLSearchParams({from:from.value,to:to.value});status.textContent='Загрузка…';try{let response=await fetch('/api/pnl?'+query);if(!response.ok)throw Error(await response.text());let data=await response.json();from.value=data.period.from;to.value=data.period.to;total.innerHTML=totalCard(data.total,data.previous_total);markets.innerHTML=Object.entries(data.marketplaces).map(([key,value])=>card(key,value,data.previous_marketplaces[key]||{},Number(data.total.revenue||0),Number(data.total.profit||0))).join('');status.textContent=`Финансовый период ${data.period.from} — ${data.period.to}; сравнение с равным периодом ${data.previous_period.from} — ${data.previous_period.to}`}catch(error){status.innerHTML=`<p class="error">${error.message}</p>`}}
let now=new Date(),defaultPeriod=defaultPnlPeriod(now);from.value=iso(defaultPeriod.first);to.value=iso(defaultPeriod.last);month.max=iso(now).slice(0,7);load();
</script>
</body>
</html>
