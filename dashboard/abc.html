<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ABC-анализ товаров</title>
  <style>
    :root{--bg:#0b1020;--panel:#151c30;--panel2:#11182a;--line:#29334d;--text:#eef3ff;--muted:#94a3bd;--accent:#6ea8fe;--good:#38d39f;--bad:#ff6b7a;--warn:#f5c451}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}header{padding:20px 3vw;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:end;justify-content:space-between}h1{margin:0;font-size:25px}.muted{color:var(--muted)}nav{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}nav a{color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px}nav a.active{background:var(--accent);color:#061020;font-weight:700}.filters,.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.field{display:grid;gap:4px}.field label{font-size:11px;color:var(--muted)}input,select,button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}button{background:var(--accent);color:#061020;font-weight:700;cursor:pointer}main{padding:22px 3vw 40px}.status{color:var(--muted);margin-bottom:12px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:14px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.card span{color:var(--muted)}.card b{display:block;font-size:22px;margin-top:6px}.unallocated-summary{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-size:11px;line-height:1.4;color:var(--muted)}.unallocated-summary strong{color:#f3dda0;font-size:12px}.unallocated-summary span{display:block;margin-top:3px}.notice{padding:11px;border:1px solid #705d32;background:#2b2618;border-radius:9px;color:#f4d88c;margin:10px 0}.toolbar{margin:14px 0}.toolbar input{min-width:260px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:var(--panel);max-height:calc(100vh - 360px)}table{border-collapse:separate;border-spacing:0;min-width:2460px;width:100%}th,td{padding:9px;border-right:1px solid rgba(41,51,77,.65);border-bottom:1px solid var(--line);vertical-align:top}th{position:sticky;top:0;z-index:4;background:var(--panel2);color:var(--muted);font-size:11px;text-transform:uppercase;text-align:center}.subhead th{top:34px}.product{position:sticky;left:0;z-index:2;background:var(--panel);min-width:285px}.product-head{z-index:6}.product-wrap{display:flex;gap:10px}.photo{width:48px;height:62px;object-fit:contain;background:#fff;border-radius:7px}.placeholder{display:grid;place-items:center;width:48px;height:62px;border:1px dashed #53617d;border-radius:7px;color:var(--muted);font-size:10px}.article{font-weight:750}.name{color:var(--muted);font-size:12px;margin-top:3px;max-width:205px}.money{font-weight:750;font-size:15px;white-space:nowrap}.detail{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap}.badge{display:inline-grid;place-items:center;min-width:23px;height:23px;padding:0 6px;border-radius:12px;font-weight:800;margin-left:5px}.badge.A{background:#174b3c;color:#78e4bc}.badge.B{background:#4d421d;color:#ffe184}.badge.C{background:#303a50;color:#c5d0e4}.badge.У{background:#54242d;color:#ff9ba5}.unallocated td,.unallocated .product{background:#2b2618}.info{display:inline-grid;place-items:center;width:16px;height:16px;border:1px solid #66738e;border-radius:50%;cursor:help;position:relative}.info:hover:after{content:attr(data-tip);position:absolute;z-index:20;left:0;top:22px;width:330px;padding:10px;border:1px solid #53617d;border-radius:8px;background:#080d19;color:var(--text);font-size:12px;text-transform:none;white-space:normal;text-align:left}.error{color:var(--bad)}@media(max-width:760px){header{align-items:start;flex-direction:column}.table-wrap{max-height:none}.toolbar input{min-width:0;width:100%}}
  </style>
</head>
<body>
<header>
  <div><h1>ABC по товарам / 商品ABC分析</h1><div class="muted">Финансовая SKU-матрица из нормализованного аналитического слоя</div><nav><a href="/">Оперативный</a><a href="/pnl">P&amp;L</a><a href="/stocks">Остатки</a><a class="active" href="/abc">ABC товаров</a></nav></div>
  <div class="filters"><div class="field"><label>С даты</label><input id="from" type="date"></div><div class="field"><label>По дату</label><input id="to" type="date"></div><div class="field"><label>Месяц</label><input id="month" type="month" onchange="selectMonth()"></div><button onclick="load()">Обновить</button><button onclick="exportExcel()">Выгрузить в Excel</button></div>
</header>
<main>
  <div id="status" class="status"></div><div id="coverage"></div><div id="summary" class="summary"></div>
  <div class="toolbar"><input id="search" type="search" placeholder="Артикул или название" oninput="renderRows()"><select id="scope" onchange="renderRows()"><option value="total">Все площадки</option><option value="wb">Wildberries</option><option value="ozon">Ozon</option><option value="yandex_market">Яндекс Маркет</option></select><select id="revenue-class" onchange="renderRows()"><option value="">Любой ABC выручки</option><option>A</option><option>B</option><option>C</option><option value="—">Без категории</option></select><select id="profit-class" onchange="renderRows()"><option value="">Любой ABC прибыли</option><option>A</option><option>B</option><option>C</option><option>У</option><option value="—">Без категории</option></select></div>
  <div class="table-wrap"><table><thead><tr><th class="product product-head" rowspan="2">Товар</th><th colspan="4">Итого</th><th colspan="4">Wildberries</th><th colspan="4">Ozon</th><th colspan="4">Яндекс Маркет</th></tr><tr class="subhead" id="subhead"></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<script>
const marketKeys=['total','wb','ozon','yandex_market'],names={wb:'Wildberries',ozon:'Ozon',yandex_market:'Яндекс Маркет'};
const from=document.getElementById('from'),to=document.getElementById('to'),month=document.getElementById('month'),statusBox=document.getElementById('status'),coverageBox=document.getElementById('coverage'),summaryBox=document.getElementById('summary'),rowsBox=document.getElementById('rows');let data=null;
const rubK=value=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Number(value||0)/100)+' ₽';
const pct=value=>Number(value||0).toFixed(1)+'%';const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const escapeHtml=value=>String(value||'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
const tip=text=>`<span class="info" data-tip="${escapeHtml(text)}">?</span>`;
document.getElementById('subhead').innerHTML=marketKeys.map(()=>`<th>Выручка ${tip('Финансовая выручка товара после возвратов и распределённой компенсации. Доля и ABC считаются внутри этого блока.')}</th><th>Прибыль ${tip('Выручка минус распределённые расходы площадки и себестоимость. У — убыточный товар.')}</th><th>Реклама ${tip('Итоговая сумма берётся из финансовых списаний и совпадает с P&L. Рекламные API используются для прямой привязки к SKU; неразмеченный остаток распределяется по выручке.')}</th><th>Логистика ${tip('Логистика и возвратная логистика из финансовых документов, распределённые по дневной чистой выручке.')}</th>`).join('');
function badge(value){return value&&value!=='—'?`<span class="badge ${value}">${value}</span>`:''}
function metric(value,type){if(!value||!value.available)return '<span class="muted">—</span>';if(type==='revenue')return `<div class="money">${rubK(value.revenue_kopecks)}${badge(value.revenue_category)}</div><div class="detail">доля ${pct(value.revenue_share_percent)}</div>`;if(type==='profit')return `<div class="money">${rubK(value.profit_kopecks)}${badge(value.profit_category)}</div><div class="detail">маржа ${pct(value.profit_margin_percent)}</div>`;if(type==='advertising')return `<div class="money">${rubK(value.advertising_kopecks)}</div><div class="detail">ДРР ${pct(value.advertising_drr_percent)}</div>`;return `<div class="money">${rubK(value.logistics_kopecks)}</div><div class="detail">${pct(value.logistics_share_percent)} · ${value.logistics_per_unit_kopecks===null?'—':rubK(value.logistics_per_unit_kopecks)+'/шт.'}</div>`}
function unallocatedSummary(item){if(!item||!item.available)return '';let parts=(item.components||[]).map(x=>`${escapeHtml(x.label)}: ${rubK(x.amount_kopecks)}`).join(' · ');return `<div class="unallocated-summary"><strong>Нераспределённые затраты: ${rubK(item.expense_kopecks)}</strong>${tip('Затраты без надёжной связи с конкретным SKU не включаются в прибыль отдельных товаров. Они вычитаются только при расчёте полной прибыли сверху, поэтому итог ABC совпадает с P&L.')}<span>${parts||'нераспределённых статей нет'}</span></div>`}
function renderRows(){if(!data)return;let query=document.getElementById('search').value.trim().toLowerCase(),scope=document.getElementById('scope').value,revenueClass=document.getElementById('revenue-class').value,profitClass=document.getElementById('profit-class').value;let rows=data.rows.filter(row=>{let values=row[scope];return(!query||`${row.article} ${row.name}`.toLowerCase().includes(query))&&(!revenueClass||(values?.revenue_category||'—')===revenueClass)&&(!profitClass||(values?.profit_category||'—')===profitClass)});rowsBox.innerHTML=rows.map(row=>`<tr class="${row.is_unallocated?'unallocated':''}"><td class="product"><div class="product-wrap">${row.image_url?`<img class="photo" src="${row.image_url}" loading="lazy">`:'<span class="placeholder">нет фото</span>'}<div><div class="article">${escapeHtml(row.article)}</div><div class="name">${escapeHtml(row.name)}</div></div></div></td>${marketKeys.map(key=>['revenue','profit','advertising','logistics'].map(type=>`<td>${metric(row[key],type)}</td>`).join('')).join('')}</tr>`).join('');statusBox.textContent=`Период ${data.period.from} — ${data.period.to} · показано ${rows.length} из ${data.rows.length} строк`}
function selectMonth(){if(!month.value)return;let [year,value]=month.value.split('-').map(Number);from.value=`${month.value}-01`;to.value=iso(new Date(year,value,0));load()}
function exportExcel(){window.location.href='/api/export?'+new URLSearchParams({report:'abc',from:from.value,to:to.value})}
function defaultFinancialPeriod(now){let last=new Date(now.getFullYear(),now.getMonth(),now.getDate()),daysAfterSunday=last.getDay()||7;last.setDate(last.getDate()-daysAfterSunday);return {first:new Date(last.getFullYear(),last.getMonth(),1),last}}
async function load(){statusBox.textContent='Загрузка…';try{let response=await fetch('/api/abc?'+new URLSearchParams({from:from.value,to:to.value}));if(!response.ok)throw Error(await response.text());data=await response.json();from.value=data.period.from;to.value=data.period.to;let s=data.summary;summaryBox.innerHTML=[['Выручка',rubK(s.revenue_kopecks),''],['Прибыль',rubK(s.profit_kopecks),unallocatedSummary(data.unallocated)],['Реклама',rubK(s.advertising_kopecks),''],['Логистика',rubK(s.logistics_kopecks),''],['SKU с выручкой',s.sku_count,''],['Убыточные SKU',s.unprofitable_count,'']].map(x=>`<div class="card"><span>${x[0]}</span><b>${x[1]}</b>${x[2]||''}</div>`).join('');let warnings=Object.entries(data.controls).filter(([,v])=>!v.available).map(([key,v])=>`${names[key]}: ${v.notice}`);Object.entries(data.controls).filter(([,v])=>v.available&&v.pnl_reconciled===false).forEach(([key,v])=>{let bad=Object.entries(v.pnl_reconciliation||{}).filter(([,x])=>x.delta_kopecks!==0).map(([metric,x])=>`${metric}: ${rubK(x.delta_kopecks)}`).join(', ');warnings.push(`${names[key]}: ABC не сверен с P&L (${bad})`)});if(!s.profit_reconciled)warnings.push(`Итоговая прибыль ABC не совпадает с P&L: разница ${rubK(s.profit_delta_kopecks)}`);coverageBox.innerHTML=warnings.length?`<div class="notice">${warnings.join('<br>')}</div>`:'';renderRows()}catch(error){statusBox.innerHTML=`<span class="error">${escapeHtml(error.message)}</span>`}}
let now=new Date(),defaultPeriod=defaultFinancialPeriod(now);from.value=iso(defaultPeriod.first);to.value=iso(defaultPeriod.last);month.max=iso(now).slice(0,7);load();
</script>
</body>
</html>
