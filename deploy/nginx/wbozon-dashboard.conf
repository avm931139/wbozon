server {
    listen 10.8.0.1:28443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/ssl/wbozon-dashboard.crt;
    ssl_certificate_key /etc/nginx/ssl/wbozon-dashboard.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "Private marketplace dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd-wbozon-dashboard;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://127.0.0.1:17843;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
